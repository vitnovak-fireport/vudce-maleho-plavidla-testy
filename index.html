<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trenažér VMP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred question card on chart-paper ground; signal colours follow navigation lights (red = port/wrong, green = starboard/correct). */
:root {
  --bg: #e9eef0;
  --paper: #fbfcfc;
  --ink: #14324a;
  --muted: #5b7080;
  --line: #c9d4da;
  --accent: #d79a00;        /* buoy yellow */
  --accent-ink: #2a2000;
  --ok: #1d7a4a;
  --ok-bg: #e2f2e8;
  --bad: #c0352b;
  --bad-bg: #fbe5e2;
  --chip: #dde6ea;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a24; --paper: #142532; --ink: #e3edf2; --muted: #93a8b6; --line: #2a4252;
    --accent: #f0b52a; --accent-ink: #231a00; --ok: #4cc685; --ok-bg: #133325; --bad: #ff7468; --bad-bg: #3a1a19; --chip: #1e3442;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a24; --paper: #142532; --ink: #e3edf2; --muted: #93a8b6; --line: #2a4252;
  --accent: #f0b52a; --accent-ink: #231a00; --ok: #4cc685; --ok-bg: #133325; --bad: #ff7468; --bad-bg: #3a1a19; --chip: #1e3442;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: .01em; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 small { font-weight: 500; color: var(--muted); font-size: 1.05rem; margin-left: 6px; letter-spacing: .04em; text-transform: uppercase; }
.sync { font-size: .8rem; color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; color: var(--ink); font: 600 .95rem var(--font-body); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.lbl small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 2px 10px; font: 500 .82rem var(--font-mono); cursor: pointer; }
.chip[aria-pressed="false"] { background: transparent; border-color: var(--line); color: var(--muted); text-decoration: line-through; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--paper); padding: 8px 12px; min-width: 0; }
.stat b { display: block; font: 600 1.35rem var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .m { background: var(--ok); } .bar .l { background: var(--accent); } .bar .w { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font: 500 .8rem var(--font-mono); color: var(--muted); align-items: center; }
.tag { padding: 1px 8px; border-radius: 4px; background: var(--chip); color: var(--ink); }
.tag.hot { background: var(--bad-bg); color: var(--bad); }
.tag.new { background: var(--accent); color: var(--accent-ink); }
.q { font-size: 1.2rem; font-weight: 600; margin: 0; text-wrap: pretty; }
.qimg { display: flex; flex-wrap: wrap; gap: 10px; }
.qimg img { max-height: 260px; width: auto; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.ans { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 12px 14px; font: inherit; cursor: pointer; transition: border-color .12s, background .12s; }
.ans:hover:not(:disabled) { border-color: var(--ink); }
.ans:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ans .k { font: 600 1rem var(--font-mono); width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--chip); }
.ans img { display: block; max-height: 140px; width: auto; max-width: 100%; margin-top: 8px; border-radius: 4px; background: #fff; }
.ans:disabled { cursor: default; }
.ans.correct { border-color: var(--ok); background: var(--ok-bg); }
.ans.correct .k { background: var(--ok); color: var(--paper); }
.ans.wrong { border-color: var(--bad); background: var(--bad-bg); }
.ans.wrong .k { background: var(--bad); color: var(--paper); }
.ans.dim { opacity: .55; }
.feedback { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.verdict { font: 700 1.4rem var(--font-display); letter-spacing: .02em; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.verdict small { display: block; font: 400 .85rem var(--font-body); color: var(--muted); letter-spacing: 0; }
.btn { border: 0; border-radius: 8px; background: var(--ink); color: var(--paper); font: 600 1rem var(--font-body); padding: 10px 20px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: .85rem; padding: 6px 12px; }
.btn.danger { background: var(--bad); color: var(--paper); font-size: .85rem; padding: 6px 12px; }
.hint { font-size: .8rem; color: var(--muted); }
kbd { font: 500 .75rem var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
footer { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 16px; }
  .q { font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Trenažér VMP <small>Vůdce malého plavidla</small></h1>
    <span class="sync" id="sync">Postup se ukládá v tomto prohlížeči</span>
  </header>

  <div class="controls">
    <div class="ctl">
      <span class="lbl">Zkouška <small>(lze kombinovat)</small></span>
      <div class="seg" id="exam">
        <button type="button" id="ex-M" data-v="M" aria-pressed="true">M</button>
        <button type="button" id="ex-C" data-v="C" aria-pressed="false">C</button>
        <button type="button" id="ex-S" data-v="S" aria-pressed="false">S</button>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">Režim</span>
      <div class="seg" id="mode">
        <button type="button" id="md-all" data-v="all" aria-pressed="true">Všechny otázky</button>
        <button type="button" id="md-todo" data-v="todo" aria-pressed="false">Nezvládnuté</button>
        <button type="button" id="md-weak" data-v="weak" aria-pressed="false">Jen chyby</button>
      </div>
    </div>
  </div>
  <div class="ctl">
    <span class="lbl">Okruhy</span>
    <div class="chips" id="sets"></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="st-total">0</b><span>otázek v okruzích</span></div>
    <div class="stat"><b id="st-seen">0</b><span>už viděno</span></div>
    <div class="stat"><b id="st-master">0</b><span>zvládnuto (3× v řadě)</span></div>
    <div class="stat"><b id="st-sess">–</b><span>úspěšnost dnes</span></div>
  </div>
  <div class="bar" id="bar"><i class="m"></i><i class="l"></i><i class="w"></i></div>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>zvládnuté</span>
    <span><i style="background:var(--accent)"></i>rozpracované</span>
    <span><i style="background:var(--bad)"></i>naposledy špatně</span>
    <span><i style="background:var(--chip)"></i>neviděné</span>
  </div>

  <main class="card" id="card" aria-live="polite"></main>

  <footer>
    <span class="hint">Klávesy: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> odpověď, <kbd>Enter</kbd> další otázka</span>
    <span id="reset-zone"><button type="button" class="btn ghost" id="reset">Smazat postup</button></span>
  </footer>
</div>

<script>
const DATA = {"M":[{"id":"M1","n":1,"set":"PP1 2015","q":"Termínem \"plavidlo\" se ve smyslu zákona o vnitrozemské plavbě rozumí:","img":[],"a":[{"t":"ovladatelné těleso určené k pohybu nebo stání na vodě, zejména za účelem přepravy osob a nákladu nebo nesení strojů a zařízení.","img":[]},{"t":"loď s vlastním pohonem, plovoucí těleso a plovoucí zařízení.","img":[]},{"t":"těleso schopné plavby, které je řiditelné a splňuje podmínky plovatelnosti.","img":[]}],"c":0},{"id":"M2","n":2,"set":"PP1 2015","q":"Termínem \"plavidlo s vlastním pohonem\" se ve smyslu pravidel plavebního provozu rozumí:","img":[],"a":[{"t":"plavidlo vybavené vlastním strojním pohonem s výjimkou plavidla, jehož strojní pohon je používán pouze pro manévry a snadnější vedení při vlečení nebo tlačení.","img":[]},{"t":"plavidlo, které pluje výlučně pomocí plachet.","img":[]},{"t":"plavidlo, které nepluje pomocí vlastního strojního pohonu ani pomocí plachet.","img":[]}],"c":0},{"id":"M3","n":3,"set":"PP1 2015","q":"Termínem \"plachetnice\" se ve smyslu pravidel plavebního provozu rozumí:","img":[],"a":[{"t":"plavidlo, které pluje pouze pomocí plachet a současně nepoužívá vlastní strojní pohon.","img":[]},{"t":"plavidlo, které pluje pomocí plachet a zároveň používá vlastní strojní pohon.","img":[]},{"t":"plavidlo, které pluje pomocí plachet nebo vlastního strojního pohonu, ale jeho délka nepřesahuje 20 m.","img":[]}],"c":0},{"id":"M4","n":4,"set":"PP1 2015","q":"Malé plavidlo je ve smyslu zákona o vnitrozemské plavbě:","img":[],"a":[{"t":"plavidlo, jehož délka nepřesahuje 20 metrů, není určené k vlečení, tlačení nebo vedení v bočně svázané sestavě jiných než malých plavidel nebo k přepravě více než 12 cestujících a není tlačným člunem.","img":[]},{"t":"plavidlo, jehož délka nepřesahuje 22 metrů, převozní loď, tlačný člun, jehož délka nepřesahuje 20 metrů a které není určené k přepravě více než 20 cestujících.","img":[]},{"t":"plavidlo, jehož délka nepřesahuje 24 m, není používané k vlečení, tlačení nebo vedení plavidel v bočně svázané sestavě a není na něm povoleno přepravovat více než 24 cestujících.","img":[]}],"c":0},{"id":"M5","n":5,"set":"PP1 2015","q":"Plavidlo, jehož délka nepřesahuje 20 m, není ve smyslu zákona o vnitrozemské plavbě malým plavidlem:","img":[],"a":[{"t":"je-li určené k vlečení, tlačení nebo vedení bočně svázané sestavy jiných než malých plavidel.","img":[]},{"t":"je-li určené nebo používané k vlečení, tlačení nebo vedení bočně svázané sestavy jiných plavidel.","img":[]},{"t":"je-li používané k vlečení vodních lyžařů.","img":[]}],"c":0},{"id":"M6","n":6,"set":"PP1 2015","q":"\"Plovoucí stroj\" je ve smyslu zákona o vnitrozemské plavbě:","img":[],"a":[{"t":"zařízení schopné plavby vybavené mechanickým zařízením a určené pro práce na vodní cestě nebo v přístavu.","img":[]},{"t":"zařízení schopné plavby, užívané na vodních cestách, které není určeno k opakovanému přemísťování (plovárna, dok, přístavní můstek, plovoucí garáž, botel, atd.).","img":[]},{"t":"konstrukce, objekt nebo pevné seskupení předmětů, schopné plavby, které není plavidlem ani plovoucím zařízením.","img":[]}],"c":0},{"id":"M7","n":7,"set":"PP1 2015","q":"\"Plovoucí zařízení\" je ve smyslu zákona o vnitrozemské plavbě:","img":[],"a":[{"t":"zařízení schopné plavby s výjimkou plovoucího stroje, které není určeno k opakovanému přemísťování.","img":[]},{"t":"plavidlo vybavené mechanickým zařízením a určené pro práce na vodních cestách nebo v přístavech.","img":[]},{"t":"plavidlo zkonstruované nebo speciálně vybavené zařízením pro plavbu vlečením nebo tlačením.","img":[]}],"c":0},{"id":"M8","n":8,"set":"PP1 2015","q":"Termín \"sestava plavidel\" je ve smyslu zákona o vnitrozemské plavbě:","img":[],"a":[{"t":"spojení několika plavidel, z nichž alespoň jedno je s vlastním pohonem.","img":[]},{"t":"komplex plovoucích prostředků, určený pro údržbu vodních cest, který se skládá z bagru, elevátoru, remorkérů a tlačných nebo vlečných člunů.","img":[]},{"t":"spojení plavidel, plovoucích zařízení nebo plovoucích těles boky vedle sebe.","img":[]}],"c":0},{"id":"M9","n":9,"set":"PP1 2015","q":"\"Vlečná sestava\" je ve smyslu zákona o vnitrozemské plavbě znění:","img":[],"a":[{"t":"spojení jednoho nebo více plavidel vlečených jedním nebo několika plavidly s vlastním pohonem, která jsou součástí sestavy.","img":[]},{"t":"spojení plavidel boky vedle sebe, z nichž se ani jedno nenachází před plavidlem s vlastním pohonem, které zajišťuje pohyb sestavy.","img":[]},{"t":"plavidlo, plovoucí těleso nebo jejich spojení, vlečené ze břehu.","img":[]}],"c":0},{"id":"M10","n":10,"set":"PP1 2015","q":"Stojícím plavidlem je ve smyslu pravidel plavebního provozu plavidlo, které:","img":[],"a":[{"t":"je přímo nebo nepřímo zakotveno nebo přímo nebo nepřímo vyvázáno ke břehu.","img":[]},{"t":"stojí vůči břehu a motory pracují jen takovou silou, aby překonaly účinek proudu vody.","img":[]},{"t":"je uvázlé na překážce nebo na dně vodní cesty, v důsledku čehož došlo ke ztrátě volného pohybu.","img":[]}],"c":0},{"id":"M11","n":11,"set":"PP1 2015","q":"Plujícím plavidlem je ve smyslu pravidel plavebního provozu plavidlo, které:","img":[],"a":[{"t":"není přímo nebo nepřímo zakotveno, vyvázáno ke břehu nebo není nasedlé.","img":[]},{"t":"je zakotveno nebo vyvázáno, ale zasahuje nejméně polovinou šířky do plavební dráhy.","img":[]},{"t":"je zakotveno nebo vyvázáno mimo stanoviště označené plavebními znaky, vyjadřujícími způsob stání.","img":[]}],"c":0},{"id":"M12","n":12,"set":"PP1 2015","q":"Zastavením je ve smyslu pravidel plavebního provozu pro plující plavidlo stav, při kterém plavidlo stojí ve vztahu:","img":[],"a":[{"t":"ke břehu.","img":[]},{"t":"k jinému plujícímu plavidlu, plovoucímu tělesu nebo plovoucímu zařízení.","img":[]},{"t":"k vodnímu proudu.","img":[]}],"c":0},{"id":"M13","n":13,"set":"PP1 2015","q":"Světlo, použité v návěstních svítidlech plavidel je ve smyslu pravidel plavebního provozu:","img":[],"a":[{"t":"bílé, červené, zelené, žluté a modré.","img":[]},{"t":"bílé, červené, zelené, žluté a fialové.","img":[]},{"t":"bílé, červené, zelené, žluté a oranžové.","img":[]}],"c":0},{"id":"M14","n":14,"set":"PP1 2015","q":"Krátkým zvukem je ve smyslu pravidel plavebního provozu:","img":[],"a":[{"t":"zvuk trvající 1 sekundu.","img":[]},{"t":"zvuk trvající 1/4 sekundy.","img":[]},{"t":"zvuk trvající 4 sekundy.","img":[]}],"c":0},{"id":"M15","n":15,"set":"PP1 2015","q":"Dlouhým zvukem je ve smyslu pravidel plavebního provozu:","img":[],"a":[{"t":"zvuk trvající 4 sekundy.","img":[]},{"t":"zvuk trvající 1/4 sekundy.","img":[]},{"t":"zvuk trvající 1 sekundu.","img":[]}],"c":0},{"id":"M16","n":16,"set":"PP1 2015","q":"Blikavým světlem je ve smyslu pravidel plavebního provozu přerušované světlo:","img":[],"a":[{"t":"s počtem 40 až 60 záblesků za minutu.","img":[]},{"t":"s minimálním počtem 90 záblesků za minutu.","img":[]},{"t":"s jedním, dvěma nebo třemi záblesky za minutu.","img":[]}],"c":0},{"id":"M17","n":17,"set":"PP1 2015","q":"Nocí je ve smyslu pravidel plavebního provozu období:","img":[],"a":[{"t":"mezi západem slunce a východem slunce.","img":[]},{"t":"které začíná půl hodiny po západu slunce a končí půl hodiny před východem slunce.","img":[]},{"t":"od 20,00 h do 4,30 h v létě a dobu od 17,00 h do 7,00 h v zimě.","img":[]}],"c":0},{"id":"M18","n":18,"set":"PP1 2015","q":"Dnem je ve smyslu pravidel plavebního provozu období:","img":[],"a":[{"t":"mezi východem slunce a západem slunce.","img":[]},{"t":"které začíná půl hodiny před východem slunce a končí půl hodiny po západu slunce.","img":[]},{"t":"od 4,30 h do 20,00 h v létě a dobu od 7,00 h do 17,00 h v zimě.","img":[]}],"c":0},{"id":"M19","n":19,"set":"PP1 2015","q":"Sníženou viditelností jsou ve smyslu pravidel plavebního provozu:","img":[],"a":[{"t":"podmínky, při nichž viditelnost omezuje kouřmo, mlha, hustý déšť, sněhová vánice, dým atd.","img":[]},{"t":"kouřmo, mlha, hustý déšť a doba mezi západem a východem slunce.","img":[]},{"t":"podmínky, pro které není z kormidelny idla a může vytvořit plavební překážku nebo ohrozit bezpečnost plavby, je vůdce plavidla povinen:","img":[],"a":[{"t":"místo viditelně označit, je-li to možné, a neodkladně uvědomit plavební úřad a správce vodní cesty.","img":[]},{"t":"zastavit plavbu v obou směrech a vyčkat na místě, dokud plavební úřad překážku neodstraní.","img":[]},{"t":"vyzvat Hasičský záchranný sbor České republiky, aby zajistil na vodní cestě plavební značení, než bude překážka odstraněna.","img":[]}],"c":0},{"id":"M38","n":38,"set":"PP1 2015","q":"Zjistí-li posádka plavidla neznámou překážku provozu na vodní cestě, je vůdce plavidla povinen:","img":[],"a":[{"t":"neodkladně uvědomit plavební úřad a správce vodní cesty a je-li to možné, toto místo viditelně označit.","img":[]},{"t":"postarat se o její odstranění z plavební dráhy.","img":[]},{"t":"označit toto místo bójkou nebo vlajkou čtvercového tvaru libovolné barvy.","img":[]}],"c":0},{"id":"M39","n":39,"set":"PP1 2015","q":"Na vodní cestě je zakázáno:","img":[],"a":[{"t":"poškozovat plavební značení a jiná plavební zařízení umístěná na vodní cestě a používat je k vyvazování.","img":[]},{"t":"respektovat význam signálních znaků za plavby v podmínkách snížené viditelnosti mlhou, hustým deštěm, sněhovou vánicí nebo v noci.","img":[]},{"t":"řídit se signálními znaky, které jsou umístěny na břehu vlevo ve směru plavby plavidla.","img":[]}],"c":0},{"id":"M40","n":40,"set":"PP1 2015","q":"Na vodní cestě nebo v její blízkosti je zakázáno umísťovat předměty:","img":[],"a":[{"t":"které jsou zaměnitelné s plavebním značením.","img":[]},{"t":"které mohou z dálky připomínat siluetu plavidla.","img":[]},{"t":"které jsou obtížně odstranitelné.","img":[]}],"c":0},{"id":"M41","n":41,"set":"PP1 2015","q":"Vůdce plavidla je povinen uvědomit plavební úřad a správce vodní cesty:","img":[],"a":[{"t":"o zjištěných změnách, přemístění nebo poškození plavebního značení nebo poškození stavby na vodní cestě.","img":[]},{"t":"že břehový porost brání přehledu při prop římou masáží srdce, dýcháním z plic do plic).","img":[]},{"t":"jsou pro dýchání sice nedostatečné, ale znamenají, že krevní oběh je v pořádku.","img":[]},{"t":"jsou typickou známkou otravy alkoholem nebo drogami, postiženého je nutné ihned uložit do \"stabilizované polohy\".","img":[]}],"c":0},{"id":"M386","n":386,"set":"ZP 2015","q":"Resuscitaci ukončíme:","img":[],"a":[{"t":"pokud začne postižený normálně dýchat.","img":[]},{"t":"jakmile se postižený aspoň jednou nadechne.","img":[]},{"t":"pokud nemůžeme provádět dýchání z plic do plic.","img":[]}],"c":0},{"id":"M387","n":387,"set":"ZP 2015","q":"Aniž došlo k obnovení životních funkcí, ukončíme resuscitaci utonulého:","img":[],"a":[{"t":"při úplném vyčerpání zachránců.","img":[]},{"t":"po bezvýsledném úsilí trvajícím alespoň 20 minut.","img":[]},{"t":"pokud se podařilo spojit se záchrannou službou a případ jí ohlásit.","img":[]}],"c":0},{"id":"M388","n":388,"set":"ZP 2015","q":"Pro kvalitu resuscitace má největší význam:","img":[],"a":[{"t":"co nejméně přerušovaná nepřímá masáž srdce, prováděná správnou frekvencí a dostatečně hluboko.","img":[]},{"t":"správný poměr mezi masáží srdce a vdechy z plic do plic.","img":[]},{"t":"účinné vdechy z úst do úst co největším objemem.","img":[]}],"c":0},{"id":"M389","n":389,"set":"ZP 2015","q":"Optimální frekvence kompresí při nepřímé masáži srdce je:","img":[],"a":[{"t":"100x za minutu (téměř 2x za vteřinu) u všech postižených.","img":[]},{"t":"60x za minutu u dospělých, 80x za minutu u dětí.","img":[]},{"t":"30x za minutu se dvěma přestávkami délce cca 10 sekund.","img":[]}],"c":0},{"id":"M390","n":390,"set":"ZP 2015","q":"Pokud z jakéhokoliv důvodu během resuscitace nemůžeme nebo nechceme provádět dýchání z plic do plic:","img":[],"a":[{"t":"pokračujeme v nepřetržité nepřímé masáži srdce.","img":[]},{"t":"pokračujeme v nepřímé masáži srdce a vždy po 30 kompresích uděláme cca 10 sekund pauzu.","img":[]},{"t":"ukončíme resuscitaci, samotná nepřímá masáž srdce je neúčinná a zbytečná.","img":[]}],"c":0},{"id":"M391","n":391,"set":"ZP 2015","q":"Normální klidová dechová frekvence dospělého je:","img":[],"a":[{"t":"12 - 15 za minutu.","img":[]},{"t":"30 - 40 za minutu.","img":[]},{"t":"4 - 6 za minutu.","img":[]}],"c":0},{"id":"M392","n":392,"set":"ZP 2015","q":"Pokud není prováděna resuscitace, nastává nezvratné poškození mozku při zástavě cca po:","img":[],"a":[{"t":"pěti minutách.","img":[]},{"t":"jedné minutě.","img":[]},{"t":"patnácti minutách.","img":[]}],"c":0},{"id":"M393","n":393,"set":"ZP 2015","q":"Pokud si nejsme jisti, zda postižený v bezvědomí dýchá nebo nedýchá:","img":[],"a":[{"t":"postupujeme tak, jako kdyby nedýchal, tj. zahájíme resuscitaci.","img":[]},{"t":"přiložíme k ústům zrcátko nebo brýle a sledujeme, zda se mlží. Pokud se nemlží, není třeba provádět resuscitaci.","img":[]},{"t":"postupujeme tak, jako kdyby dýchal. Uložíme ho do stabilizované polohy a vyčkáme příjezdu záchranné služby.","img":[]}],"c":0},{"id":"M394","n":394,"set":"ZP 2015","q":"Tonoucího, který byl vytažen z vody, je v bezvědomí a chrčivě, ale zřetelně a pravidelně dýchá:","img":[],"a":[{"t":"uložíme do polohy na boku, vyčistíme dýchací cesty, pečlivě sledujeme stav dýchání.","img":[]},{"t":"uložíme do polohy na břiše, pokud možno hlavou dolů, a opakovaným mačkáním hrudníku vytlačíme co nejvíc vody z plic a dýchacích cest.","img":[]},{"t":"uložíme na záda a ihned zahájíme resuscitaci.","img":[]}],"c":0},{"id":"M395","n":395,"set":"ZP 2015","q":"Postižený večer upadl, uhodil se do hlavy, druhý den ráno je nápadně ospalý, při pokusu o komunikaci zmatený, zvrací. Odbornou lékařskou pomoc:","img":[],"a":[{"t":"je nutné vyhledat (případně zavolat záchrannou službu).","img":[]},{"t":"je zbytečné volat, do 24 hodin se stav zpravidla upraví sám.","img":[]},{"t":"zásadně nevoláme, tyto příznaky nejsou nijak závažné.","img":[]}],"c":0},{"id":"M396","n":396,"set":"ZP 2015","q":"Postižený spadl z výšky, je zmatený, nepamatuje si, co se stalo, posedává. Nejlepší je:","img":[],"a":[{"t":"pokud nehrozí nebezpečí dalšího úrazu, nechat jej zaujmout polohu jaká mu vyhovuje a zavolat záchrannou službu.","img":[]},{"t":"pokusit se jej \"rozchodit\" a pokud se stav do 30 minut nezlepší, odvézt postiženého do nemocnice.","img":[]},{"t":"uložit jej do protišokové polohy (se sníženou hlavou a zvýšenými dolními končetinami) a zavolat záchrannou službu.","img":[]}],"c":0},{"id":"M397","n":397,"set":"ZP 2015","q":"Zaškrcení končetiny:","img":[],"a":[{"t":"se používá pouze výjimečně, pokud krvácení nelze zvládnout přiložením tlakového obvazu.","img":[]},{"t":"se používá přednostně, pokud jde o krvácení z končetiny.","img":[]},{"t":"se již nepoužívá.","img":[]}],"c":0},{"id":"M398","n":398,"set":"ZP 2015","q":"Předloktí popálené vroucí vodou je před příjezdem záchranné služby nejlépe ošetřit:","img":[],"a":[{"t":"několikaminutovým chlazením čistou vodou.","img":[]},{"t":"potřením jakoukoliv mastí, v nouzi i zubní pastou.","img":[]},{"t":"udržením postiženého místa v teple.","img":[]}],"c":0},{"id":"M399","n":399,"set":"ZP 2015","q":"Prst popálený o horký předmět ošetříme:","img":[],"a":[{"t":"několikaminutovým chlazením čistou vodou, není třeba dalšího ošetření. Pokud se později vytvoří puchýř, nepropichujeme jej.","img":[]},{"t":"potřením jakoukoliv mastí, v nouzi i zubní pastou, a ihned voláme záchrannou službu.","img":[]},{"t":"přiložením obvazu, pokud se později vytvoří puchýř, propíchneme jej, odstřihneme a ošetříme dezinfekcí.","img":[]}],"c":0},{"id":"M400","n":400,"set":"ZP 2015","q":"Nejlepší poloha pro postiženého, který je při vědomí, ale hlásí, že se mu špatně dýchá, je:","img":[],"a":[{"t":"vsedě nebo polosedě s možností zapřít ruce o židli nebo podložku.","img":[]},{"t":"vleže na zádech se zakloněnou hlavou.","img":[]},{"t":"stabilizovaná poloha vleže na boku.","img":[]}],"c":0},{"id":"M401","n":401,"set":"ZP 2015","q":"Stabilizovanou (někdy také \"zotavovací\") polohou se rozumí poloha:","img":[],"a":[{"t":"na boku s hlavou otočenou k podložce.","img":[]},{"t":"na zádech s hlavou v mírném předklonu.","img":[]},{"t":"na břiše s hlavou otočenou na stranu.","img":[]}],"c":0},{"id":"M402","n":402,"set":"ZP 2015","q":"První pomoc při přehřátí a úpalu provedeme tak, že:","img":[],"a":[{"t":"přesuneme postiženého do stínu, podáváme chladné nápoje (nejlépe minerální vodu), studené obklady na hlavu.","img":[]},{"t":"přesuneme postiženého do teplé místnosti a podáme větší množství alkoholických nápojů.","img":[]},{"t":"přesuneme postiženého do stínu, nedáváme nic jíst ani pít, a přivoláme záchrannou službu.","img":[]}],"c":0},{"id":"M403","n":403,"set":"ZP 2015","q":"Při opakovaných průjmech:","img":[],"a":[{"t":"podáváme pouze dietní stravu, živočišné uhlí a neslazené tekutiny, pokud se stav neupraví do 24 hodin, vyhledáme lékaře.","img":[]},{"t":"vyvoláme zvracení, nedáváme nic jíst ani pít, vyhledáme lékaře.","img":[]},{"t":"podáváme na tuky bohatou stravu, doplněnou menšími dávkami alkoholu.","img":[]}],"c":0},{"id":"M404","n":404,"set":"ZP 2015","q":"Mezi příznaky rozvinutého šoku při vnitřním krvácení patří:","img":[],"a":[{"t":"bledost, opocení, schvácený výraz, pocit strachu o život, apatie.","img":[]},{"t":"nápadně silná reakce na bolest, křik nebo agitované jednání, hyperaktivita.","img":[]},{"t":"zvýšená teplota a nápadně horké ruce","img":[]}],"c":0},{"id":"M405","n":405,"set":"ZP 2015","q":"Pozorujeme-li u postiženého po úrazu příznaky šoku:","img":[],"a":[{"t":"ihned přivoláme záchrannou službu.","img":[]},{"t":"podáme velké množství tekutin, záchrannou službu přivoláme, pokud se stav do dvou hodin nezlepší.","img":[]},{"t":"postiženého se snažíme uklidnit, pokud máme k dispozici, podáme sedativa a léky na snížení teploty.","img":[]}],"c":0},{"id":"M406","n":406,"set":"ZP 2015","q":"Žilní krvácení z končetiny ošetřujeme tak, že:","img":[],"a":[{"t":"postiženou končetinu zvedneme nad úroveň těla a přiložíme tlakový obvaz.","img":[]},{"t":"postiženého uložíme do protišokové polohy a končetinu zaškrtíme.","img":[]},{"t":"zraněného uložíme do \"stabilizované\" polohy a stiskneme tepnu na postižené končetině v tlakovém bodě.","img":[]}],"c":0},{"id":"M407","n":407,"set":"ZP 2015","q":"Při krvácení z nosu:","img":[],"a":[{"t":"umístíme postiženého do polohy vsedě s lehce předkloněnou hlavou, na zátylek přikládáme studené obklady, palcem a ukazovákem stiskneme nosní křídla a počkáme několik minut. Pokud se krvácení ani po opakovaných pokusech nezastaví nebo se dokonce zvětšuje, dopravíme postiženého k lékaři.","img":[]},{"t":"umístíme postiženého do polohy na zádech se zvednutýma nohama, přivoláme záchrannou službu.","img":[]},{"t":"umístíme postiženého do polohy vsedě, zakloníme hlavu, podáme větší množství horkých tekutin.","img":[]}],"c":0},{"id":"M408","n":408,"set":"ZP 2015","q":"Při žilním krvácení:","img":[],"a":[{"t":"volně vytéká temně červená krev","img":[]},{"t":"vystřikuje jasně červená krev.","img":[]},{"t":"volně vytéká jasně červená krev.","img":[]}],"c":0},{"id":"M409","n":409,"set":"ZP 2015","q":"Při tepenném krvácení:","img":[],"a":[{"t":"vystřikuje jasně červená krev.","img":[]},{"t":"volně vytéká temně červená krev","img":[]},{"t":"volně vytéká jasně červená krev.","img":[]}],"c":0},{"id":"M410","n":410,"set":"ZP 2015","q":"Národní přímé tísňové číslo záchranné služby v České republice je:","img":[],"a":[{"t":"155.","img":[]},{"t":"150.","img":[]},{"t":"158.","img":[]}],"c":0},{"id":"M411","n":411,"set":"ZP 2015","q":"Jednotné evropské tísňové číslo je:","img":[],"a":[{"t":"112.","img":[]},{"t":"110.","img":[]},{"t":"111.","img":[]}],"c":0}],"C":[{"id":"C1","n":1,"set":"MP1","q":"Mezinárodní pravidla pro zabránění srážkám na moři se vztahují:","img":[],"a":[{"t":"na všechna plavidla.","img":[]},{"t":"jen na plavidla s pohonem.","img":[]},{"t":"jen na plavidla za plavby.","img":[]}],"c":0},{"id":"C2","n":2,"set":"MP1","q":"Mezinárodní pravidla pro zabránění srážkám na moři platí:","img":[],"a":[{"t":"na volných mořích a na všech vodách s nimi spojených.","img":[]},{"t":"na mořích, kde se projevuje příliv nad 0,3 m.","img":[]},{"t":"na mořích mimo teritoriální vody.","img":[]}],"c":0},{"id":"C3","n":3,"set":"MP1","q":"Odpovědnost za následky vzniklé neplněním mezinárodních pravidel pro zabránění srážkám na moři nese:","img":[],"a":[{"t":"majitel, velitel nebo posádka lodě.","img":[]},{"t":"stát, pod jehož vlajkou je loď provozována.","img":[]},{"t":"pojišťovna, u níž uzavřel majitel smlouvu o pojištění odpovědnosti.","img":[]}],"c":0},{"id":"C4","n":4,"set":"MP1","q":"Loď provádějící bagrovací, hydrografické a podmořské práce je:","img":[],"a":[{"t":"plavidlo s omezenou manévrovací schopností.","img":[]},{"t":"neovladatelné plavidlo.","img":[]},{"t":"plavidlo omezené svým ponorem.","img":[]}],"c":0},{"id":"C5","n":5,"set":"MP1","q":"Výraz za plavby znamená:","img":[],"a":[{"t":"loď není zakotvena, vyvázána ani nesedí na dně.","img":[]},{"t":"loď je vyvázána.","img":[]},{"t":"loď je zakotvena.","img":[]}],"c":0},{"id":"C6","n":6,"set":"MP1","q":"Při mlze, mlhovém oparu, padajícím sněhu, silném dešti, písečné bouři se označuje tento stav jako:","img":[],"a":[{"t":"snížená viditelnost.","img":[]},{"t":"podmínky pro plavbu s omezenou manévrovací schopností.","img":[]},{"t":"snížená manévrovací schopnost plavidla.","img":[]}],"c":0},{"id":"C7","n":7,"set":"MP1","q":"Každá loď musí vést nepřetržité a zodpovědné vizuální a sluchové pozorování, aby:","img":[],"a":[{"t":"bylo možno plně zhodnotit situaci a nebezpečí srážky.","img":[]},{"t":"neminula přístav.","img":[]},{"t":"neztratila za snížené viditelnosti z dohledu pobřeží.","img":[]}],"c":0},{"id":"C8","n":8,"set":"MP1","q":"Nepřetržité zodpovědné, vizuální a sluchové pozorování musí vést:","img":[],"a":[{"t":"každá loď podle převládajících okolností a podmínek.","img":[]},{"t":"každá loď, ale pouze v noci a za snížené viditelnosti.","img":[]},{"t":"pouze malá plavidla, zvláště pak v noci a za snížené viditelnosti.","img":[]}],"c":0},{"id":"C9" :"S525","n":525,"set":"P3 2015","q":"Plachta, resp. její jednotlivé aerodynamické profily při plavbě proti větru a při bočních větrech:","img":[],"a":[{"t":"jsou obtékány proudem vzduchu pod různým úhlem náběhu.","img":[]},{"t":"stáčejí proud vzduchu šikmo dolů k hladině.","img":[]},{"t":"jsou deformovány vzduchovými víry, jejichž intenzita je závislá na síle větru.","img":[]}],"c":0},{"id":"S526","n":526,"set":"P3 2015","q":"Účinnost profilu plachty při plavbě proti slabému přednímu větru je maximální:","img":[],"a":[{"t":"když proudění kolem něho je plynulé a bez víření, tzv. laminární proudění.","img":[]},{"t":"při úhlu náběhu přes 20°.","img":[]},{"t":"využívá-li se odrazu větru od vodní hladiny.","img":[]}],"c":0},{"id":"S527","n":527,"set":"P3 2015","q":"Laminární proudění vzduchu je závislé:","img":[],"a":[{"t":"na aerodynamickém profilu plachty a tvaru zadního lemu.","img":[]},{"t":"na sklonu švů jednotlivých dílů a pružnosti použité plachtoviny.","img":[]},{"t":"na tvaru trupu lodě.","img":[]}],"c":0},{"id":"S528","n":528,"set":"P3 2015","q":"Výhradně přetlaku na plachtách využívá plachetnice při jízdě:","img":[],"a":[{"t":"na zadním větru.","img":[]},{"t":"ostře proti větru.","img":[]},{"t":"při bočním větru.","img":[]}],"c":0},{"id":"S529","n":529,"set":"P3 2015","q":"Při plavbě ostře proti silnému větru je výhodnější plachta:","img":[],"a":[{"t":"plošší s menším vydutím.","img":[]},{"t":"s větším vydutím.","img":[]},{"t":"se středním vydutím.","img":[]}],"c":0},{"id":"S530","n":530,"set":"P3 2015","q":"Při jízdě na zadním větru je výhodnější plachta:","img":[],"a":[{"t":"s velkým vydutím, protože obtékání plachty je turbulentní a pohyb lodi vpřed způsobuje přetlak v plachtě a nikoliv sání.","img":[]},{"t":"plochá, protože laminární proudění je účinnější.","img":[]},{"t":"se středním vydutím, protože má výhodnější průběh sání.","img":[]}],"c":0},{"id":"S531","n":531,"set":"P3 2015","q":"Vliv kosatky na hlavní plachtu:","img":[],"a":[{"t":"se projevuje v p t ploutev a nadzvednout list kormidla.","img":[]},{"t":"je nutné naklánět loď do návětří.","img":[]}],"c":0},{"id":"S565","n":565,"set":"P4 2015","q":"Má-li loď při jízdě proti větru dosáhnout většího stoupání, je třeba:","img":[],"a":[{"t":"přitáhnout jezdec na otěžovém vozíku do návětří a přitáhnout kosatku.","img":[]},{"t":"vypustit jezdec na otěžovém vozíku k boku.","img":[]},{"t":"více vychýlit kormidlo.","img":[]}],"c":0},{"id":"S566","n":566,"set":"P4 2015","q":"Při poryvech za plavby na předním nebo bočním větru je třeba:","img":[],"a":[{"t":"vysednout na bok lodě a vést kormidlo i plachtu tak, abychom zabránili velkému náklonu lodě do závětří.","img":[]},{"t":"nechat loď naklonit do návětří, a pak ji energickým zasednutím vyvážit.","img":[]},{"t":"vytáhnout ploutev, aby se zmenšil vztlak, který na ni působí.","img":[]}],"c":0},{"id":"S567","n":567,"set":"P4 2015","q":"Při plavbě na bočním větru je výhodnější:","img":[],"a":[{"t":"více povolit hlavní plachtu než při plavbě proti větru, zvýší se tím dopředná síla a zmenší se náklon plachetnice.","img":[]},{"t":"více přitáhnout hlavní plachtu vůči větru, protože se zvýší rychlost i přes větší náklon lodě.","img":[]},{"t":"mít plachty přitažené co nejvíce i za cenu jejich skasání, protože účinek sání je tak největší.","img":[]}],"c":0},{"id":"S568","n":568,"set":"P4 2015","q":"Jestliže při křižování nebo na bočním kursu vítr zesílí a loď se stává značně návětrnou, je účelné:","img":[],"a":[{"t":"posunout ploutev více dozadu, popř. zmenšit záklon stěžně (je-li to za plavby možné).","img":[]},{"t":"posunout ploutev víc dopředu.","img":[]},{"t":"sklonit stěžen více dozadu.","img":[]}],"c":0},{"id":"S569","n":569,"set":"P4 2015","q":"Plavba po větru (na zadním větru) je plavba:","img":[],"a":[{"t":"když vítr vane zezadu, a to až do cca 30° na obě strany od podélné osy plachetnice.","img":[]},{"t":"pouze když vítr vane přímo zezadu.","img":[]},{"t":"pouze s větrem, jehož směr se uchyluje od směru plavby lodě max. 10° na obě strany.","img":[]}],"c":0},{"id":"S570","n":570,"set":"P4 2015","q":"Při plavbě malé plachetnice na zadní vítr se nesmí zejména:","img":[],"a":[{"t":"zatěžovat příď lodě, protože by se mohla zabořit do vody a dojít tak k převržení lodě.","img":[]},{"t":"napnout kosatku na stěžeň.","img":[]},{"t":"zatěžovat záď lodě.","img":[]}],"c":0},{"id":"S571","n":571,"set":"P4 2015","q":"Při plavbě na silný zadní vítr je vhodné pro bezpečné vedení lodě:","img":[],"a":[{"t":"převést loď na mírně zadoboční kurz plavby.","img":[]},{"t":"povolit maximálně hlavní plachtu.","img":[]},{"t":"zasednout loď víc vpředu.","img":[]}],"c":0},{"id":"S572","n":572,"set":"P4 2015","q":"Obrat proti větru (tzv. re) je obrat:","img":[],"a":[{"t":"při kterém loď vyostřuje tak, aby se setrvačností dostala přes postavení přímo proti větru a přešla do postavení ostře proti větru na druhém boku.","img":[]},{"t":"při kterém se stáčí loď zádí proti větru a v okamžiku zádí přímo proti větru se rychlým přehozením spinakru docílí přetočení lodě na druhý bok.","img":[]},{"t":"provedený energickým odpadnutím při současném spuštění kosatky a jejím opětném vytažení po dokončeném obratu.","img":[]}],"c":0},{"id":"S573","n":573,"set":"P4 2015","q":"Plavba na bočním kurzu je:","img":[],"a":[{"t":"rychlejší než plavba proti větru.","img":[]},{"t":"pomalejší než plavba proti větru.","img":[]},{"t":"stejně rychlá jako plavba proti větru.","img":[]}],"c":0},{"id":"S574","n":574,"set":"P4 2015","q":"Za silného větru a ve vlnách se stoupavost plachetnice:","img":[],"a":[{"t":"zmenšuje.","img":[]},{"t":"nemění.","img":[]},{"t":"zvětšuje.","img":[]}],"c":0},{"id":"S575","n":575,"set":"P4 2015","q":"Obrat po větru (tzv. halsa) je manévr:","img":[],"a":[{"t":"prováděný tak, že příď lodě se stáčí po větru a v okamžiku, kdy loď stojí zádí proti větru, se přehodí ráhno na druhý bok a obrat se dokončí.","img":[]},{"t":"prováděný při skasané hlavní plachtě využitím kosatky k obratu.","img":[]},{"t":"prováděný pouze pomocí hlavní plachty při spuštěné kosatce.","img":[]}],"c":0},{"id":"S576","n":576,"set":"P4 2015","q":"Při plavbě na silný zadní vítr musíme zabránit:","img":[],"a":[{"t":"prudkému přehození ráhna z jednoho boku na druhý použitím kontraotěže.","img":[]},{"t":"zvýšení rychlosti.","img":[]},{"t":"nadměrnému tahu na otěže.","img":[]}],"c":0},{"id":"S577","n":577,"set":"P4 2015","q":"Při plavbě na zadní vítr se snažíme zamezit:","img":[],"a":[{"t":"příčnému kolébání lodě.","img":[]},{"t":"zvýšení rychlosti.","img":[]},{"t":"skluzu.","img":[]}],"c":0},{"id":"S578","n":578,"set":"P4 2015","q":"Přehození ráhna se nejlépe provádí za silného větru:","img":[],"a":[{"t":"v jízdě plnou rychlostí a s vyváženou lodí.","img":[]},{"t":"při zpomalení plavby (např. najetím na vlnu) a náklonu do závětří.","img":[]},{"t":"po odpadnutí a naklonění lodi do návětří.","img":[]}],"c":0},{"id":"S579","n":579,"set":"P4 2015","q":"Příčné kolébání lodi při plavbě na zadní vítr je z hlediska bezpečnosti plavby:","img":[],"a":[{"t":"nebezpečné a pro posádku nepříjemné.","img":[]},{"t":"nežádoucí, ale není nebezpečné.","img":[]},{"t":"žádoucí.","img":[]}],"c":0},{"id":"S580","n":580,"set":"P4 2015","q":"Kontrolu správného nastavení plachet provádíme pomocí:","img":[],"a":[{"t":"vějičky a stuh (špionků).","img":[]},{"t":"polohy kormidelní páky.","img":[]},{"t":"úhloměru umístěného na lodi.","img":[]}],"c":0},{"id":"S581","n":581,"set":"P4 2015","q":"Při zvrhnutí lodě má posádka:","img":[],"a":[{"t":"zůstat u lodě, aby ji mohly záchranné čluny najít.","img":[]},{"t":"snažit se doplavat k nejbližšímu břehu, i když je dosti vzdálen.","img":[]},{"t":"vždy plavat vstříc záchrannému člunu nebo jiné lodi v dohledu.","img":[]}],"c":0},{"id":"S582","n":582,"set":"P4 2015","q":"Při vleku havarované lodi motorovým člunem je třeba:","img":[],"a":[{"t":"spustit plachty.","img":[]},{"t":"vytáhnout spinaker.","img":[]},{"t":"odpojit stěžeň od lodě.","img":[]}],"c":0}]};
const ALL = [...DATA.M, ...DATA.C, ...DATA.S];
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));
const LS_KEY = "vmp-progress-v1", LS_UI = "vmp-ui-v1";
// Leitner-style weights: box 0 = last answer wrong, each correct answer moves one box up.
const WEIGHT = [10, 5, 2.5, 1, 0.5, 0.3];
const NEW_WEIGHT = 3, COOLDOWN = 6, MASTER_BOX = 3;

let prog = { turn: 0, q: {} };
let ui = { exams: ["M"], mode: "all", off: [] };
let cur = null, answered = false, recent = [], sess = { ok: 0, n: 0 };
let db = null, docRef = null, saveTimer = null, saving = Promise.resolve();

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const imgs = list => list.map(f => `<img src="img/${encodeURIComponent(f)}" alt="" loading="lazy">`).join("");

try { const p = JSON.parse(localStorage.getItem(LS_KEY)); if (p && p.q) prog = p; } catch (e) {}
try { const u = JSON.parse(localStorage.getItem(LS_UI)); if (u) ui = { ...ui, ...u }; } catch (e) {}
// Older versions stored a single exam: "M", "C" or "MC".
if (ui.exam) { ui.exams = ui.exam === "MC" ? ["M", "C"] : [ui.exam]; delete ui.exam; }
ui.exams = (ui.exams || []).filter(k => DATA[k]);
if (!ui.exams.length) ui.exams = ["M"];

function pool() {
  return ui.exams.flatMap(k => DATA[k]).filter(q => !ui.off.includes(q.set));
}
function weakOf(list) { return list.filter(q => { const s = prog.q[q.id]; return s && s.w > 0 && s.b < MASTER_BOX; }); }
function todoOf(list) { return list.filter(q => { const s = prog.q[q.id]; return !s || s.b < MASTER_BOX; }); }

function pick() {
  let list = pool();
  if (ui.mode === "weak") list = weakOf(list);
  else if (ui.mode === "todo") list = todoOf(list);
  if (!list.length) return null;
  const avoid = new Set(recent.slice(-Math.min(COOLDOWN, list.length - 1)));
  let total = 0;
  const w = list.map(q => {
    if (avoid.has(q.id)) return 0;
    const s = prog.q[q.id];
    const x = s ? WEIGHT[Math.min(s.b, WEIGHT.length - 1)] : NEW_WEIGHT;
    total += x; return x;
  });
  let r = Math.random() * total;
  for (let i = 0; i < list.length; i++) { r -= w[i]; if (w[i] > 0 && r <= 0) return list[i]; }
  return list.find((_, i) => w[i] > 0) || list[0];
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function next() {
  const q = pick();
  answered = false;
  if (!q) { cur = null; renderEmpty(); renderStats(); return; }
  cur = { q, order: shuffle(q.a.map((_, i) => i)) };
  recent.push(q.id); if (recent.length > 20) recent.shift();
  render(); renderStats();
}

function renderEmpty() {
  const msg = !pool().length ? null
    : ui.mode === "weak" ? "V zvolených okruzích teď nemáte žádné chyby k opakování."
    : ui.mode === "todo" ? "Všechny otázky ve zvolených okruzích máte zvládnuté."
    : null;
  $("card").innerHTML = msg
    ? `<div class="empty">${msg}<br><br><button type="button" class="btn" id="go-all">Procvičovat všechny otázky</button></div>`
    : `<div class="empty">Nemáte vybraný žádný okruh. Zapněte aspoň jeden výše.</div>`;
  const b = $("go-all"); if (b) b.onclick = () => setMode("all");
}

function render(choice) {
  const { q, order } = cur, s = prog.q[q.id];
  const tag = !s ? `<span class="tag new">nová</span>` : s.b === 0 ? `<span class="tag hot">minule špatně</span>` : `<span class="tag">${s.n - s.w}/${s.n} správně</span>`;
  const answers = order.map((ai, i) => {
    const a = q.a[ai];
    let cls = "";
    if (answered) cls = ai === q.c ? "correct" : ai === choice ? "wrong" : "dim";
    return `<button type="button" class="ans ${cls}" id="ans-${i}" data-ai="${ai}" ${answered ? "disabled" : ""}>
      <span class="k">${"abc"[i]}</span><span>${esc(a.t)}${imgs(a.img)}</span></button>`;
  }).join("");
  let fb = "";
  if (answered) {
    const ok = choice === q.c;
    const st = prog.q[q.id];
    fb = `<div class="feedback">
      <div class="verdict ${ok ? "ok" : "bad"}">${ok ? "Správně" : "Špatně"}
        <small>${ok ? (st.b >= MASTER_BOX ? "Otázka je zvládnutá, uvidíte ji jen občas." : "Ještě se vrátí, dokud ji nezodpovíte 3× v řadě.") : "Tuto otázku dostanete brzy znovu."}</small></div>
      <button type="button" class="btn" id="next">Další otázka →</button></div>`;
  }
  $("card").innerHTML = `
    <div class="meta"><span>Zkouška ${q.id[0]} · č. ${q.n}</span><span class="tag">${esc(q.set)}</span>${tag}</div>
    <p class="q">${esc(q.q)}</p>
    ${q.img.length ? `<div class="qimg">${imgs(q.img)}</div>` : ""}
    <div class="answers">${answers}</div>${fb}`;
  $("card").querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.ai));
  const n = $("next"); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
}

function answer(ai) {
  if (answered || !cur) return;
  answered = true;
  const q = cur.q, ok = ai === q.c;
  const s = prog.q[q.id] || { b: 0, n: 0, w: 0 };
  s.n++; prog.turn++; s.t = prog.turn;
  if (ok) s.b = Math.min(s.b + 1, WEIGHT.length - 1); else { s.w++; s.b = 0; }
  prog.q[q.id] = s;
  sess.n++; if (ok) sess.ok++;
  render(ai); renderStats(); save();
}

function renderStats() {
  const list = pool();
  let seen = 0, master = 0, weak = 0;
  for (const q of list) { const s = prog.q[q.id]; if (!s) continue; seen++; if (s.b >= MASTER_BOX) master++; else if (s.b === 0) weak++; }
  $("st-total").textContent = list.length;
  $("st-seen").textContent = seen;
  $("st-master").textContent = master;
  $("st-sess").textContent = sess.n ? `${Math.round(100 * sess.ok / sess.n)} % (${sess.ok}/${sess.n})` : "–";
  const pct = x => list.length ? (100 * x / list.length) + "%" : "0";
  const [m, l, w] = $("bar").children;
  m.style.width = pct(master); l.style.width = pct(seen - master - weak); w.style.width = pct(weak);
}

function renderControls() {
  document.querySelectorAll("#exam button").forEach(b => b.setAttribute("aria-pressed", ui.exams.includes(b.dataset.v)));
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === ui.mode));
  const sets = [...new Set(ui.exams.flatMap(k => DATA[k].map(q => q.set)))];
  $("sets").innerHTML = sets.map((s, i) => {
    const n = ALL.filter(q => q.set === s).length;
    return `<button type="button" class="chip" id="set-${i}" data-s="${esc(s)}" aria-pressed="${!ui.off.includes(s)}">${esc(s)} · ${n}</button>`;
  }).join("");
  $("sets").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const s = c.dataset.s;
    ui.off = ui.off.includes(s) ? ui.off.filter(x => x !== s) : [...ui.off, s];
    saveUi(); renderControls(); next();
  });
}
function saveUi() { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch (e) {} }
function setMode(v) { ui.mode = v; saveUi(); renderControls(); next(); }
document.querySelectorAll("#exam button").forEach(b => b.onclick = () => {
  const k = b.dataset.v;
  if (ui.exams.includes(k)) { if (ui.exams.length === 1) return; ui.exams = ui.exams.filter(x => x !== k); }
  else ui.exams = ["M", "C", "S"].filter(x => x === k || ui.exams.includes(x));
  saveUi(); renderControls(); next();
});
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.v));

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey || !cur) return;
  const i = "123".indexOf(e.key) >= 0 ? "123".indexOf(e.key) : "abc".indexOf(e.key.toLowerCase());
  if (!answered && i >= 0 && e.key.length === 1) { answer(cur.order[i]); e.preventDefault(); }
  else if (answered && (e.key === "Enter" || e.key === " " || e.key === "ArrowRight")) { next(); e.preventDefault(); }
});

// In-page confirmation; the viewer ignores confirm().
function bindReset() {
  $("reset").onclick = () => {
    $("reset-zone").innerHTML = `<span class="hint">Opravdu smazat celý postup? </span><button type="button" class="btn danger" id="reset-yes">Smazat</button> <button type="button" class="btn ghost" id="reset-no">Zpět</button>`;
    $("reset-no").onclick = restoreReset;
    $("reset-yes").onclick = () => { prog = { turn: 0, q: {} }; sess = { ok: 0, n: 0 }; recent = []; save(true); restoreReset(); next(); };
  };
}
function restoreReset() {
  $("reset-zone").innerHTML = `<button type="button" class="btn ghost" id="reset">Smazat postup</button>`;
  bindReset();
}

// Persistence: localStorage right away, plus the viewer's private db document so progress follows them across devices.
function save(now) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(prog)); } catch (e) {}
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(prog));
    saving = saving.then(() => docRef.set(body)).then(
      () => setSync("Postup uložen ve vašem účtu"),
      () => setSync("Uložení do účtu selhalo, postup zůstává v tomto prohlížeči"));
  }, now ? 0 : 1500);
}
function setSync(t) { $("sync").textContent = t; }

async function connect() {
  if (!window.claude?.use) return;
  try {
    const [d, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user && await user.id();
    if (!d || !uid) return;
    db = d; docRef = db.doc("data/users/" + uid + "/progress");
    const snap = await docRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.q && (remote.turn || 0) > (prog.turn || 0)) {
      prog = JSON.parse(JSON.stringify(remote));
      try { localStorage.setItem(LS_KEY, JSON.stringify(prog)); } catch (e) {}
      if (!answered) next(); else renderStats();
    } else if (prog.turn > 0 && (!remote || prog.turn > (remote.turn || 0))) {
      save(true);
    }
    setSync("Postup se ukládá ve vašem účtu");
  } catch (e) { docRef = null; }
}

bindReset();
renderControls();
next();
connect();
</script>
